{{ define "main" }}
<style>
    .about-hero-bleed {
        position: relative;
        width: 100vw;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        margin-top: -165px;
        height: 60vh;
        min-height: 340px;
        overflow: hidden;
    }

    .about-hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 22% center;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .about-hero-scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.6) 100%);
    }

    .about-hero-title {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 40px;
        z-index: 2;
        text-align: center;
        color: #fff;
        font-size: 2.6em;
        font-weight: 400;
        letter-spacing: 1px;
        font-family: 'Georgia', serif;
        text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 4px 24px rgba(0,0,0,0.7);
        padding: 0 20px;
    }

    .about-text {
        margin-top: 60px;
    }

    .about-text p {
        text-align: justify;
        hyphens: auto;
    }

    @media (max-width: 600px) {
        .about-hero-bleed { margin-top: -113px; height: 45vh; min-height: 260px; }
        .about-hero-title { font-size: 1.9em; bottom: 24px; }
    }
</style>

<div class="about-hero-bleed">
    {{ with resources.Get "images/about/hero.jpg" }}
    <img src="{{ (.Resize "1920x webp q80").RelPermalink }}" alt="{{ $.Title }}" class="about-hero-img">
    {{ end }}
    <div class="about-hero-scrim"></div>
    <h1 class="about-hero-title">{{ .Title }}</h1>
</div>

<article class="about-text">
    {{ .Content }}
</article>
{{ end }}
